
name: Docker Baseimage CI/CD

on:
  push:
    branches:
      - workflow

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-common:
    name: Build common (amd64)
    runs-on: ubuntu-22.04

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Set image name
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "image=ghcr.io/${OWNER,,}/baseimage-gui-build:common-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build common
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.common
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha,scope=common-amd64
          cache-to: type=gha,scope=common-amd64,mode=max

  build:
    name: Build ${{ matrix.name }} (amd64)
    needs: build-common
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: alpine-3.23
            baseimage: jlesage/baseimage:alpine-3.23-v3.11.12

          - name: ubuntu-24.04
            baseimage: jlesage/baseimage:ubuntu-24.04-v3.11.12

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          provenance: false
          tags: baseimage-gui:${{ matrix.name }}
          build-args: |
            BASEIMAGE_COMMON=${{ needs.build-common.outputs.image }}
            BASEIMAGE=${{ matrix.baseimage }}
            IMAGE_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}-amd64
          cache-to: type=gha,scope=${{ matrix.name }}-amd64,mode=max

      - name: Test image
        env:
          DOCKER_IMAGE: baseimage-gui:${{ matrix.name }}
        run: |
          docker run --rm "$DOCKER_IMAGE" \
            sh -c 'echo Testing image on $(uname -m)...'
